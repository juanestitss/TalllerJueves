<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Consumo Api #1 - Mejorado</title>
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 3rem;
        }
        .galeria .card {
            transition: transform 0.2s;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .galeria .card:hover {
            transform: translateY(-5px);
        }
        .card-img-top {
            height: 150px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-dark">Galería de Imágenes</h1>
            <p class="text-muted">Carga contenido dinámico desde una API externa</p>
            <button type="button" class="btn btn-primary btn-lg shadow-sm" id="botonCargar">
                Cargar Imágenes
            </button>
        </div>
        
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 galeria" id="galeriaEspacio">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scriptConsumoApi1.js"></script>
</body>
</html>
